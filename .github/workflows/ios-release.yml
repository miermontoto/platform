# workflow REUTILIZABLE (workflow_call): build + firma + subida del ipa a App Store
# Connect desde un runner macOS de github. objetivo: nunca tocar un mac — el runner es
# una vm efímera; tú solo añades secrets. vive en el repo platform y lo invocan las
# apps que usan platform como submódulo, desde un caller fino:
#
#   jobs:
#     release:
#       uses: miermontoto/platform/.github/workflows/ios-release.yml@main
#       with:
#         app: duckhunt                     # slug: artifact y nombre por defecto del perfil
#         bundle_id: info.duckhunt.app
#         icon_bg: '#0a0c0e'                # fondo del icono/splash generados
#         deep_link_scheme: info.duckhunt.app   # opcional: oauth móvil por deep link
#         sign_in_with_apple: true          # opcional: entitlement applesignin
#         widget_extension_dir: ios-widgets  # opcional: extensión WidgetKit (ver SETUP, paso 7)
#         app_group: group.info.duckhunt.app # obligatorio con widget_extension_dir
#         widget_min_ios_version: '17.0'     # opcional: target de la extensión (AppIntents = 17)
#         app_sources_dir: ios-intents       # opcional: swift + .xcstrings extra del target App (ver paso 8)
#         upload: true
#       secrets: inherit
#
# REQUISITO: el package.json raíz de la app declara `"packageManager": "pnpm@<v>"`.
# de ahí saca la versión de pnpm el paso "Setup pnpm" (ver su comentario); sin ese
# campo el workflow muere antes de instalar nada.
#
# el caller conserva sus triggers (push a main / workflow_dispatch / push de tag
# ios-v*) y su concurrency; la lógica de build vive aquí y se corrige UNA vez para
# todas las apps.
#
# BUILD AUTOMÁTICO (push a main): el job `guard` filtra los push a RAMA por el input
# `path_filter` (pathspecs de git, uno por línea) para no quemar un runner macOS
# —facturado x10 en repos privados— por un commit que solo toca la api; recuerda que
# el pre-commit hook bumpa VERSION en CADA commit, así que sin filtro dispararía
# siempre. dispatch y push de tag NO se filtran nunca: son acciones deliberadas. no se
# usa el `paths:` nativo de github a propósito, porque en push de tag el evento no
# trae commits y saltaría el workflow entero.
#
# ────────────────────────────────────────────────────────────────────────────
# SETUP DE UNA SOLA VEZ por app (todo desde linux, sin mac):
#
#  0. Apple Developer Program ($99/año). decide el bundle id (p.ej. info.duckhunt.app).
#
#  1. APP ID + APP RECORD
#     - developer.apple.com → Certificates, IDs & Profiles → Identifiers → (+)
#       → App IDs → App → tu bundle id (marca las capabilities que use la app:
#       Push Notifications, Sign in with Apple, etc.)
#     - si habilitas Sign in with Apple: tras añadir la capability al App ID, REGENERA
#       el provisioning profile (ahora incluye el entitlement) y actualiza el secret
#       IOS_PROVISIONING_PROFILE_BASE64; si el profile no lo permite, el export falla.
#     - appstoreconnect.apple.com → Apps → (+) New App → platform iOS, tu bundle id
#       y nombre. (crea el registro; aún sin builds.)
#
#  2. CERTIFICADO DE DISTRIBUCIÓN (desde linux con openssl):
#       openssl genrsa -out ios_dist.key 2048
#       openssl req -new -key ios_dist.key -out ios_dist.csr \
#         -subj "/CN=<app> distribution/O=Juan Mier/C=ES"
#     - developer.apple.com → Certificates → (+) → "Apple Distribution" → sube el
#       .csr → descarga distribution.cer
#       openssl x509 -in distribution.cer -inform DER -out ios_dist.pem -outform PEM
#       openssl pkcs12 -export -out ios_dist.p12 -inkey ios_dist.key \
#         -in ios_dist.pem -name "Apple Distribution" -passout pass:UNA_PASS_FUERTE
#       base64 -w0 ios_dist.p12 > ios_dist.p12.b64   # → secret IOS_DIST_CERT_P12_BASE64
#
#  3. APP STORE CONNECT API KEY (para subir sin mac):
#     - appstoreconnect.apple.com → Users and Access → Integrations → App Store
#       Connect API → (+) Generate key, rol "App Manager". descarga AuthKey_XXXX.p8
#       (solo se descarga una vez). anota Key ID e Issuer ID (arriba de la tabla).
#
#  4. TEAM ID: developer.apple.com → Membership details, 10 caracteres.
#
#  5. PROVISIONING PROFILE (App Store, firma manual):
#     - developer.apple.com → Profiles → (+) → Distribution "App Store Connect" →
#       tu App ID → cert de distribución del paso 2 → nómbralo "<app> App Store CI"
#       (o pasa otro nombre en el input provisioning_profile) → descarga el
#       .mobileprovision → base64 -w0 → secret IOS_PROVISIONING_PROFILE_BASE64
#
#  6. SECRETS del repo de la app (Settings → Secrets and variables → Actions),
#     heredados con `secrets: inherit`:
#       IOS_DIST_CERT_P12_BASE64        ← contenido de ios_dist.p12.b64
#       IOS_DIST_CERT_PASSWORD          ← la pass que pusiste en -passout
#       ASC_KEY_ID                      ← Key ID del paso 3
#       ASC_ISSUER_ID                   ← Issuer ID del paso 3
#       ASC_API_KEY_P8                  ← contenido íntegro del AuthKey_XXXX.p8
#       APPLE_TEAM_ID                   ← Team ID del paso 4
#       IOS_PROVISIONING_PROFILE_BASE64 ← contenido del .mobileprovision en base64 (paso 5)
#       SUBMODULES_PAT (opcional)       ← PAT con lectura del submódulo platform (si fuese privado)
#       IOS_WIDGET_PROVISIONING_PROFILE_BASE64 ← solo con widgets (paso 7)
#
#  7. WIDGETS (opcional, input widget_extension_dir + app_group): la extensión WidgetKit
#     se genera en ci desde un dir de la app con fuentes swift + Info.plist +
#     <nombre>.entitlements (ver duckhunt packages/web/ios-widgets). ops previas:
#     - Identifiers → App ID nuevo "<bundle_id>.widgets" (explicit).
#     - Identifiers → App Groups → (+) "group.<bundle_id>"; habilitar la capability App
#       Groups en AMBOS App IDs (app y widgets) con ese group.
#     - REGENERAR el perfil de la app (paso 5): al cambiar sus capabilities el perfil
#       anterior deja de valer → actualizar IOS_PROVISIONING_PROFILE_BASE64.
#     - crear el perfil App Store de la extensión "<app> Widgets App Store CI" (o pasa
#       otro nombre en widget_provisioning_profile) → IOS_WIDGET_PROVISIONING_PROFILE_BASE64.
#     el step "Verificar la extensión de widgets" comprueba el .appex y el app group en
#     ambos binarios antes de subir.
#
#  8. FUENTES NATIVAS DE LA APP (opcional, input app_sources_dir): swift + string catalogs
#     (.xcstrings) que se compilan DENTRO del target App (p.ej. app intents + app shortcuts de
#     siri, que solo se registran desde el binario de la app, no desde una extensión widgetkit).
#     sin ops en apple: no añade capabilities ni perfiles.
#
# VERSIONADO: CFBundleShortVersionString = input marketing_version > tag ios-vX.Y.Z >
# AUTOMÁTICA (la pregunta el job `guard` a App Store Connect, ver "TRENES").
# CFBundleVersion = run_number del caller (único y creciente por run, mismo patrón que
# versionCode en android-release.yml).
# ojo: apple SOLO acepta dígitos y puntos en marketing_version, así que la versión
# snapshot de la plataforma (26w35af) NO sirve — de ahí que android sincronice su
# versionName con VERSION y iOS no pueda. en los builds automáticos la marketing_version
# se queda quieta y crece el CFBundleVersion: TestFlight muestra "1.3.1 (142)",
# "1.3.1 (143)"…
#
# TRENES: App Store Connect agrupa las subidas por marketing_version ("pre-release
# train") y CIERRA el tren de una versión en cuanto apple la APRUEBA — a partir de ahí
# rechaza cualquier build con un número <= ese (90062 + 90186, "Invalid Pre-Release
# Train"), y lo hace en el upload, con el runner macOS ya gastado. antes el caller
# declaraba la versión viva a mano y CADA publicación rompía el workflow hasta que
# alguien subía el número. ahora, sin versión explícita, el guard la resuelve contra la
# api de ASC: la versión de App Store en preparación (creada en ASC y aún sin aprobar)
# si la hay, y si no el patch siguiente a la última aprobada (1.3.0 aprobada → 1.3.1).
# flujo: para la próxima submission crea la versión en ASC (p.ej. 1.4.0) y los builds
# siguientes caen solos en ese tren. una versión explícita que no supere la última
# aprobada muere en el guard, en segundos, en vez de al final del build.
# ────────────────────────────────────────────────────────────────────────────

name: iOS release (reusable)

on:
  workflow_call:
    inputs:
      app:
        description: 'slug de la app: nombra el artifact y el provisioning profile por defecto'
        required: true
        type: string
      bundle_id:
        description: 'bundle id de la app (CFBundleIdentifier / App ID)'
        required: true
        type: string
      marketing_version:
        description: 'CFBundleShortVersionString; vacío → derivada del tag ios-v* o, sin tag, la siguiente que acepta App Store Connect'
        required: false
        type: string
        default: ''
      upload:
        description: 'subir el ipa a App Store Connect (TestFlight)'
        required: false
        type: boolean
        default: false
      icon_bg:
        description: 'color de fondo (#rrggbb) del app icon y el splash generados'
        required: true
        type: string
      logo_path:
        description: 'ruta del logo fuente relativa a la raíz del repo'
        required: false
        type: string
        default: 'packages/web/assets/logo.png'
      logo_has_background:
        description: 'true si el logo ya trae fondo propio (no se rellena con icon_bg)'
        required: false
        type: boolean
        default: false
      deep_link_scheme:
        description: 'custom URL scheme para la vuelta del oauth móvil; vacío → no se registra'
        required: false
        type: string
        default: ''
      sign_in_with_apple:
        description: 'inyectar el entitlement com.apple.developer.applesignin (el profile debe permitirlo)'
        required: false
        type: boolean
        default: false
      provisioning_profile:
        description: 'nombre del provisioning profile de App Store; vacío → "<app> App Store CI"'
        required: false
        type: string
        default: ''
      min_ios_version:
        description: 'IPHONEOS_DEPLOYMENT_TARGET mínimo; apple exige >= 15.0 desde primavera 2027 (ITMS-90068)'
        required: false
        type: string
        default: '15.0'
      widget_extension_dir:
        description: 'dir (relativo a packages/web) con las fuentes swift + Info.plist + entitlements de una extensión WidgetKit; vacío → sin widgets'
        required: false
        type: string
        default: ''
      app_group:
        description: 'app group (group.<bundle id>) compartido por la app y la extensión de widgets; obligatorio con widget_extension_dir'
        required: false
        type: string
        default: ''
      widget_provisioning_profile:
        description: 'nombre del provisioning profile de App Store de la extensión; vacío → "<app> Widgets App Store CI"'
        required: false
        type: string
        default: ''
      app_sources_dir:
        description: 'dir (relativo a packages/web) con fuentes swift + .xcstrings + <lang>.lproj/*.strings que se añaden al target App; vacío → ninguna'
        required: false
        type: string
        default: ''
      widget_min_ios_version:
        description: 'deployment target de la extensión de widgets (puede ser mayor que el de la app: en un ios anterior la app instala sin widgets); vacío → min_ios_version'
        required: false
        type: string
        default: ''
      path_filter:
        description: 'pathspecs de git (uno por línea) que disparan el build en push a rama; vacío → siempre'
        # el default deja fuera pnpm-lock.yaml y packages/api a propósito: el lockfile
        # se mueve con cualquier bump de dependabot de la api (irrelevante para el
        # binario móvil) y constants.ts lo bumpa el pre-commit hook en CADA commit. si
        # una app quiere reconstruir también con el lockfile, se lo pasa desde su caller.
        required: false
        type: string
        default: |
          packages/web
          platform
          .github/workflows

jobs:
  guard:
    # filtra los push a rama del build AUTOMÁTICO: un commit que solo toca la api no
    # merece quemar un runner macOS (facturado x10 en repos privados). NO se usa el
    # filtro `paths` nativo de github porque en push de TAG el evento no trae commits
    # y el workflow entero se saltaría, matando el release manual por tag. aquí en
    # cambio dispatch y tag pasan siempre. corre en ubuntu: ~20s frente a los ~5 min
    # de macOS que evita. por lo mismo resuelve aquí la versión de marketing: un tren
    # cerrado se detecta en segundos y no tras el build entero.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      build: ${{ steps.decide.outputs.build }}
      marketing_version: ${{ steps.version.outputs.marketing_version }}
    steps:
      - name: Checkout (historia completa para diffear el push)
        # solo hace falta clonar cuando de verdad se va a diffear: en dispatch y tag
        # el paso siguiente sale por la rama de "sin filtro" sin tocar git.
        if: github.event_name == 'push' && github.ref_type == 'branch'
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Decidir si el push toca el build móvil
        id: decide
        env:
          FILTER: ${{ inputs.path_filter }}
          BEFORE: ${{ github.event.before }}
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          # solo se filtra el push a rama; dispatch y tag son acciones deliberadas.
          if [ "$EVENT" != "push" ] || [ "$REF_TYPE" != "branch" ] || [ -z "$FILTER" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"; echo "sin filtro (evento $EVENT, ref_type $REF_TYPE)"; exit 0
          fi
          # primer push de la rama o force-push: el commit previo no existe → no se
          # puede diffear, así que se construye (fail-open, nunca perder un release).
          if [ -z "$BEFORE" ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            echo "build=true" >> "$GITHUB_OUTPUT"; echo "sin commit previo diffeable ($BEFORE) → build"; exit 0
          fi
          # $FILTER SIN comillas a propósito: se apoya en el word splitting para
          # pasar cada línea como un pathspec suelto a git.
          CHANGED=$(git diff --name-only "$BEFORE" "$GITHUB_SHA" -- $FILTER)
          if [ -n "$CHANGED" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "cambios que afectan al build móvil:"; echo "$CHANGED"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "el push no toca ninguno de estos pathspecs → se omite el release:"; echo "$FILTER"
          fi

      - name: Resolver versión de marketing (App Store Connect)
        # explícita (input > tag ios-v*) o automática contra la api de ASC; ver "TRENES"
        # en la cabecera. node del runner, sin deps: el jwt ES256 lo firma node:crypto.
        id: version
        if: steps.decide.outputs.build == 'true'
        env:
          INPUT_VERSION: ${{ inputs.marketing_version }}
          BUNDLE_ID: ${{ inputs.bundle_id }}
          UPLOAD: ${{ inputs.upload }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
        run: |
          node --input-type=module <<'JS'
          import { createPrivateKey, sign } from 'node:crypto';
          import { appendFileSync } from 'node:fs';

          const env = process.env;
          const API = 'https://api.appstoreconnect.apple.com';
          const TOKEN_TTL_S = 600;
          const TAG_PREFIX = 'ios-v';
          const FIRST_VERSION = '1.0.0';
          // CFBundleShortVersionString: hasta tres enteros separados por puntos.
          const VERSION_RE = /^\d+(\.\d+){0,2}$/;
          // estados PREVIOS a la aprobación: el tren de esa versión sigue abierto. todo lo
          // demás (aprobada, publicada, reemplazada o un estado nuevo de apple) cuenta como
          // cerrado: esta lista es estable, la de estados post-aprobación crece con cada
          // renombrado (READY_FOR_SALE → READY_FOR_DISTRIBUTION…).
          const OPEN_STATES = new Set([
            'PREPARE_FOR_SUBMISSION', 'READY_FOR_REVIEW', 'WAITING_FOR_REVIEW', 'IN_REVIEW',
            'WAITING_FOR_EXPORT_COMPLIANCE', 'DEVELOPER_REJECTED', 'REJECTED',
            'METADATA_REJECTED', 'INVALID_BINARY',
          ]);

          const fail = (msg) => { console.log(`::error::${msg}`); process.exit(1); };
          // comparación numérica por componente: ASC guarda versiones de 2 y 3 partes ('1.0').
          const parts = (v) => v.split('.').map(Number);
          const cmp = (a, b) => {
            const [pa, pb] = [parts(a), parts(b)];
            return Array.from({ length: Math.max(pa.length, pb.length) }, (_, i) => (pa[i] ?? 0) - (pb[i] ?? 0))
              .find((d) => d !== 0) ?? 0;
          };
          const max = (vs) => vs.reduce((m, v) => (m === null || cmp(v, m) > 0 ? v : m), null);
          const bump = (v) => { const [major = 0, minor = 0, patch = 0] = parts(v); return `${major}.${minor}.${patch + 1}`; };

          const tagVersion = env.GITHUB_REF_NAME.startsWith(TAG_PREFIX) ? env.GITHUB_REF_NAME.slice(TAG_PREFIX.length) : '';
          const explicit = env.INPUT_VERSION || tagVersion;
          if (explicit && !VERSION_RE.test(explicit)) fail(`marketing_version inválida: '${explicit}' (hasta tres enteros separados por puntos)`);
          if (!env.ASC_KEY_ID || !env.ASC_ISSUER_ID || !env.ASC_API_KEY_P8) fail('faltan secrets ASC_KEY_ID / ASC_ISSUER_ID / ASC_API_KEY_P8 — revisa la cabecera del workflow en platform');

          // jwt de la api de ASC: ES256 con la misma key .p8 que usa altool en el upload.
          const b64u = (x) => Buffer.from(x).toString('base64url');
          const now = Math.floor(Date.now() / 1000);
          const unsigned = [
            { alg: 'ES256', kid: env.ASC_KEY_ID, typ: 'JWT' },
            { iss: env.ASC_ISSUER_ID, iat: now, exp: now + TOKEN_TTL_S, aud: 'appstoreconnect-v1' },
          ].map((p) => b64u(JSON.stringify(p))).join('.');
          const signature = sign('sha256', Buffer.from(unsigned), { key: createPrivateKey(env.ASC_API_KEY_P8), dsaEncoding: 'ieee-p1363' });
          const jwt = `${unsigned}.${b64u(signature)}`;
          const api = async (path) => {
            const res = await fetch(`${API}${path}`, { headers: { authorization: `Bearer ${jwt}` } });
            if (!res.ok) fail(`App Store Connect ${res.status} en ${path}: ${await res.text()}`);
            return res.json();
          };

          const apps = await api(`/v1/apps?filter[bundleId]=${encodeURIComponent(env.BUNDLE_ID)}&fields[apps]=bundleId`);
          const app = apps.data.find((a) => a.attributes.bundleId === env.BUNDLE_ID)
            ?? fail(`no hay app en App Store Connect con bundle id ${env.BUNDLE_ID}`);
          const versions = (await api(`/v1/apps/${app.id}/appStoreVersions?filter[platform]=IOS&limit=200&fields[appStoreVersions]=versionString,appVersionState,appStoreState`))
            .data.map((v) => v.attributes);
          // appStoreState está deprecado en favor de appVersionState; se lee el nuevo primero.
          const isOpen = (v) => OPEN_STATES.has(v.appVersionState ?? v.appStoreState);
          const approved = max(versions.filter((v) => !isOpen(v)).map((v) => v.versionString));
          const preparing = max(versions.filter(isOpen).map((v) => v.versionString));
          const auto = preparing && (!approved || cmp(preparing, approved) > 0)
            ? preparing
            : approved ? bump(approved) : FIRST_VERSION;

          if (explicit && approved && cmp(explicit, approved) <= 0) {
            const msg = `marketing_version ${explicit} no supera la última aprobada (${approved}): App Store Connect rechazaría la subida (90062/90186). déjala vacía para usar ${auto}`;
            // sin upload el ipa solo va a un artifact: el tren da igual, así que solo avisa.
            env.UPLOAD === 'true' ? fail(msg) : console.log(`::warning::${msg}`);
          }
          const version = explicit || auto;
          console.log(`versión ${version} (${explicit ? 'explícita' : 'automática'}; última aprobada ${approved ?? '-'}, en preparación ${preparing ?? '-'})`);
          appendFileSync(env.GITHUB_OUTPUT, `marketing_version=${version}\n`);
          JS

  build:
    needs: guard
    if: needs.guard.outputs.build == 'true'
    # Apple exige construir con el SDK de iOS 26+ (Xcode 26) para subir a App Store
    # Connect. macos-26 (Tahoe) trae Xcode 26 por defecto.
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Checkout (con submódulo platform)
        uses: actions/checkout@v7
        with:
          submodules: recursive
          token: ${{ secrets.SUBMODULES_PAT || github.token }}

      - name: Comprobar secrets de firma
        env:
          CERT: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          KEY: ${{ secrets.ASC_API_KEY_P8 }}
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          PP: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          WPP: ${{ secrets.IOS_WIDGET_PROVISIONING_PROFILE_BASE64 }}
          WIDGET_DIR: ${{ inputs.widget_extension_dir }}
          APP_GROUP: ${{ inputs.app_group }}
        run: |
          missing=""
          [ -z "$CERT" ] && missing="$missing IOS_DIST_CERT_P12_BASE64"
          [ -z "$KEY" ]  && missing="$missing ASC_API_KEY_P8"
          [ -z "$TEAM" ] && missing="$missing APPLE_TEAM_ID"
          [ -z "$PP" ]   && missing="$missing IOS_PROVISIONING_PROFILE_BASE64"
          [ -n "$WIDGET_DIR" ] && [ -z "$WPP" ] && missing="$missing IOS_WIDGET_PROVISIONING_PROFILE_BASE64"
          [ -n "$WIDGET_DIR" ] && [ -z "$APP_GROUP" ] && { echo "::error::widget_extension_dir requiere app_group"; exit 1; }
          if [ -n "$missing" ]; then
            echo "::error::faltan secrets:$missing — revisa la cabecera del workflow en platform"
            exit 1
          fi

      - name: Resolver versión de marketing y provisioning profile
        env:
          VER: ${{ needs.guard.outputs.marketing_version }}
          INPUT_PROFILE: ${{ inputs.provisioning_profile }}
          INPUT_WIDGET_PROFILE: ${{ inputs.widget_provisioning_profile }}
          APP: ${{ inputs.app }}
        run: |
          # la versión la resuelve el job guard (explícita o contra App Store Connect). se
          # revalida (solo dígitos y puntos) porque se interpola en comandos (PlistBuddy).
          case "$VER" in
            ''|*[!0-9.]*) echo "::error::marketing_version inválida: '$VER' (solo dígitos y puntos)"; exit 1 ;;
          esac
          PROFILE="${INPUT_PROFILE:-$APP App Store CI}"
          WIDGET_PROFILE="${INPUT_WIDGET_PROFILE:-$APP Widgets App Store CI}"
          echo "MARKETING_VERSION=$VER" >> "$GITHUB_ENV"
          echo "PROFILE_NAME=$PROFILE" >> "$GITHUB_ENV"
          echo "WIDGET_PROFILE_NAME=$WIDGET_PROFILE" >> "$GITHUB_ENV"
          echo "versión $VER, perfil '$PROFILE'"

      - name: Setup pnpm
        # sin `version:` a propósito: la acción lee el campo `packageManager` del
        # package.json de la app, la MISMA fuente que usa el dev en local, así que CI y
        # local no pueden separarse (antes: 9 aquí, 11 en local, nada que los atara).
        # si se declaran los dos y no coinciden la acción muere con "Multiple versions
        # of pnpm specified"; si no hay ninguno, con "No pnpm version is specified", así
        # que toda app que use este workflow TIENE que declararlo.
        uses: pnpm/action-setup@v6

      - name: Setup Node 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Mostrar toolchain (Xcode más nuevo → SDK iOS 26+)
        run: |
          ls -d /Applications/Xcode_*.app 2>/dev/null || true
          # selecciona el Xcode de mayor versión instalado (defensivo; en macos-26 ya es 26)
          NEWEST=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          [ -n "$NEWEST" ] && sudo xcode-select -s "$NEWEST"
          xcodebuild -version
          echo "iOS SDK: $(xcrun --sdk iphoneos --show-sdk-version)"
          pod --version || sudo gem install cocoapods --no-document

      - name: Scaffold proyecto iOS (cap add) si no existe
        working-directory: packages/web
        run: |
          if [ ! -d ios ]; then
            pnpm exec cap add ios
          fi

      - name: Subir el deployment target mínimo (ITMS-90068)
        # capacitor 7 scaffolda con IPHONEOS_DEPLOYMENT_TARGET=14.0, y apple rechaza
        # MinimumOSVersion < 15.0 desde primavera 2027. el proyecto ios/ se regenera en
        # cada run (cap add), así que se inyecta aquí como el resto de la config.
        # VA ANTES del cap sync a propósito: sync re-ejecuta pod install y así los pods
        # se regeneran contra el target nuevo (sync solo reescribe el require_relative
        # del Podfile, no la línea platform, así que la edición sobrevive).
        working-directory: packages/web
        env:
          MIN_IOS: ${{ inputs.min_ios_version }}
        run: |
          PBX=ios/App/App.xcodeproj/project.pbxproj
          PODFILE=ios/App/Podfile
          # falla ruidosamente si el patrón no aparece: un no-op silencioso dejaría
          # pasar un build con MinimumOSVersion viejo, que es justo el bug a evitar.
          grep -q 'IPHONEOS_DEPLOYMENT_TARGET' "$PBX" || { echo "::error::no hay IPHONEOS_DEPLOYMENT_TARGET en $PBX"; exit 1; }
          grep -q "platform :ios" "$PODFILE" || { echo "::error::no hay 'platform :ios' en $PODFILE"; exit 1; }
          sed -i '' -E "s/IPHONEOS_DEPLOYMENT_TARGET = [0-9.]+;/IPHONEOS_DEPLOYMENT_TARGET = ${MIN_IOS};/g" "$PBX"
          sed -i '' -E "s/platform :ios, '[0-9.]+'/platform :ios, '${MIN_IOS}'/" "$PODFILE"
          echo "== deployment target =="
          grep -o 'IPHONEOS_DEPLOYMENT_TARGET = [0-9.]*;' "$PBX" | sort -u
          grep 'platform :ios' "$PODFILE"
          # verificación dura: que no quede ninguna config por debajo del mínimo
          if grep -oE 'IPHONEOS_DEPLOYMENT_TARGET = [0-9.]+;' "$PBX" | grep -vq "= ${MIN_IOS};"; then
            echo "::error::quedan configs con un deployment target distinto de ${MIN_IOS}"; exit 1
          fi

      - name: Build web (VITE_API_BASE=prod) + cap sync ios
        working-directory: packages/web
        # usa el script del repo de la app: VITE_API_BASE=<url prod> vite build
        # + cp 200.html→index.html + cap sync ios
        run: pnpm run mobile:build:ios

      - name: Registrar el custom URL scheme (deep link oauth móvil)
        # la vuelta del oauth en el browser del sistema llega por deep link
        # <scheme>://oauth/login?code=… (MOBILE_SCHEME de la api). en android lo registra
        # el intent-filter del AndroidManifest; en ios hay que declarar el scheme en
        # CFBundleURLTypes del Info.plist o SFSafariViewController no puede abrir la url
        # de vuelta. el proyecto ios/ se regenera en cada run (cap add), así que se
        # inyecta aquí, igual que el entitlement y la versión.
        if: ${{ inputs.deep_link_scheme != '' }}
        working-directory: packages/web
        env:
          SCHEME: ${{ inputs.deep_link_scheme }}
        run: |
          PLIST=ios/App/App/Info.plist
          # el Info.plist de capacitor no trae CFBundleURLTypes; lo creamos desde cero.
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes array" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0 dict" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLName string $SCHEME" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes array" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes:0 string $SCHEME" "$PLIST"
          echo "== CFBundleURLTypes inyectado =="
          /usr/libexec/PlistBuddy -c "Print :CFBundleURLTypes" "$PLIST"

      - name: Fijar firma manual en el target App (+ entitlement Sign in with Apple)
        # el proyecto ios/ se regenera en cada run (cap add), así que la config de firma
        # se inyecta aquí. el PROVISIONING_PROFILE_SPECIFIER va SOLO en el target App (no
        # en los Pods de capacitor: "Capacitor does not support provisioning profiles" si
        # el perfil se pasa global). si sign_in_with_apple=true se añade además el
        # entitlement com.apple.developer.applesignin, que el sheet nativo exige embebido
        # en el binario; el App ID y el profile deben tener la capability habilitada
        # (ver cabecera, paso 1) o el export fallará al firmar.
        working-directory: packages/web/ios/App
        env:
          SIWA: ${{ inputs.sign_in_with_apple }}
        run: |
          if [ "$SIWA" = "true" ]; then
            cat > App/App.entitlements <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>com.apple.developer.applesignin</key>
            <array><string>Default</string></array>
          </dict></plist>
          PLIST
            echo "App.entitlements escrito (Sign in with Apple)"
          fi
          # el gem xcodeproj viene con cocoapods; defensivo por si falta.
          gem list -i xcodeproj >/dev/null 2>&1 || sudo gem install xcodeproj --no-document
          ruby -e '
            require "xcodeproj"
            project = Xcodeproj::Project.open("App.xcodeproj")
            target = project.targets.find { |t| t.name == "App" } or abort("target App no encontrado")
            target.build_configurations.each do |c|
              c.build_settings["PROVISIONING_PROFILE_SPECIFIER"] = ENV["PROFILE_NAME"]
              c.build_settings["CODE_SIGN_ENTITLEMENTS"] = "App/App.entitlements" if ENV["SIWA"] == "true"
            end
            project.save
          '
          echo "firma manual fijada en el target App (perfil '$PROFILE_NAME')"

      - name: Generar app icon + splash
        # el proyecto ios/ se regenera en cada run (cap add), así que el icono de marca
        # hay que generarlo aquí desde el logo del repo con los generadores de @platform.
        # si el pin del submódulo platform aún no los trae, se omite con warning y la app
        # usa el icono por defecto de capacitor (build sigue siendo válido).
        # sharp no es dependencia de las apps → entorno npm aislado en RUNNER_TEMP.
        env:
          ICON_BG: ${{ inputs.icon_bg }}
          LOGO_PATH: ${{ inputs.logo_path }}
          LOGO_HAS_BG: ${{ inputs.logo_has_background }}
        run: |
          WS="$GITHUB_WORKSPACE"
          ICON_GEN="$WS/platform/tooling/mobile/generate-ios-icons.mjs"
          SPLASH_GEN="$WS/platform/tooling/mobile/generate-ios-splash.mjs"
          if [ ! -f "$ICON_GEN" ]; then
            echo "::warning::$ICON_GEN no existe en este pin de platform — se omite el branding del icono iOS. bump del submódulo platform para habilitarlo."
            exit 0
          fi
          ASSETS="$WS/packages/web/ios/App/App/Assets.xcassets"
          LOGO="$WS/$LOGO_PATH"
          SHARP_DIR="$RUNNER_TEMP/sharpenv"; mkdir -p "$SHARP_DIR"; cd "$SHARP_DIR"
          npm init -y >/dev/null 2>&1
          npm i sharp >/dev/null 2>&1
          node "$ICON_GEN" "{\"assetsDir\":\"$ASSETS\",\"logo\":\"$LOGO\",\"bgColor\":\"$ICON_BG\",\"logoHasBackground\":$LOGO_HAS_BG}"
          node "$SPLASH_GEN" "{\"assetsDir\":\"$ASSETS\",\"logo\":\"$LOGO\",\"bgColor\":\"$ICON_BG\"}"
          # el App Store rechaza el marketing icon si tiene canal alfa: lo quitamos.
          ICON="$ASSETS/AppIcon.appiconset/AppIcon-512@2x.png"
          node -e "const s=require('sharp');s(process.argv[1]).removeAlpha().png().toBuffer().then(b=>require('fs').writeFileSync(process.argv[1],b))" "$ICON"
          echo "icon generado:"; file "$ICON"

      - name: Fijar versión y build number
        working-directory: packages/web
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          # MARKETING_VERSION viene validada del paso "Resolver versión de marketing".
          PLIST=ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $MARKETING_VERSION" "$PLIST" \
            || /usr/libexec/PlistBuddy -c "Add :CFBundleShortVersionString string $MARKETING_VERSION" "$PLIST"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_NUMBER" "$PLIST" \
            || /usr/libexec/PlistBuddy -c "Add :CFBundleVersion string $BUILD_NUMBER" "$PLIST"
          echo "version $MARKETING_VERSION ($BUILD_NUMBER)"

      - name: Añadir fuentes nativas al target App
        # el proyecto ios/ se regenera en cada run (cap add): las fuentes swift y los string
        # catalogs (+ <lang>.lproj/*.strings) commiteados en app_sources_dir se copian a App/<dir> y se añaden al target
        # App (sources y resources) con el gem xcodeproj. los catálogos solo compilan los
        # idiomas de knownRegions, así que se registran los que traigan (el de desarrollo va
        # siempre). va tras el cap sync: pod install no toca estos ficheros.
        if: ${{ inputs.app_sources_dir != '' }}
        working-directory: packages/web/ios/App
        env:
          APP_SRC: ${{ inputs.app_sources_dir }}
        run: |
          SRC="$GITHUB_WORKSPACE/packages/web/$APP_SRC"
          [ -d "$SRC" ] || { echo "::error::app_sources_dir no existe: $SRC"; exit 1; }
          DEST="App/$(basename "$APP_SRC")"
          rm -rf "$DEST" && mkdir -p "$DEST" && cp -R "$SRC"/. "$DEST"/
          gem list -i xcodeproj >/dev/null 2>&1 || sudo gem install xcodeproj --no-document
          DEST="$DEST" ruby -rjson -e '
            require "xcodeproj"
            project = Xcodeproj::Project.open("App.xcodeproj")
            app = project.targets.find { |t| t.name == "App" } or abort("target App no encontrado")
            group = project.main_group.find_subpath("App", true).new_group(File.basename(ENV["DEST"]), File.basename(ENV["DEST"]))
            swift = Dir.glob("#{ENV["DEST"]}/*.swift").sort
            catalogs = Dir.glob("#{ENV["DEST"]}/*.xcstrings").sort
            app.add_file_references(swift.map { |f| group.new_file(File.basename(f)) })
            app.add_resources(catalogs.map { |f| group.new_file(File.basename(f)) })
            # <lang>.lproj/<nombre>.strings → un variant group por nombre (p.ej.
            # AppShortcuts.strings, cuyo .xcstrings exige deployment target 17).
            strings = Dir.glob("#{ENV["DEST"]}/*.lproj/*.strings").sort
            variants = strings.group_by { |f| File.basename(f) }.map do |name, files|
              variant = group.new_variant_group(name)
              files.each { |f| variant.new_file("#{File.basename(File.dirname(f))}/#{name}").name = File.basename(File.dirname(f), ".lproj") }
              variant
            end
            variants.each { |v| app.resources_build_phase.add_file_reference(v, true) }
            langs = catalogs.flat_map { |f| JSON.parse(File.read(f))["strings"].values.flat_map { |v| (v["localizations"] || {}).keys } } +
              strings.map { |f| File.basename(File.dirname(f), ".lproj") }
            project.root_object.known_regions = (project.root_object.known_regions + langs).uniq
            project.save
            puts "target App: #{swift.size} swift, #{catalogs.size} catálogos, #{strings.size} .strings, regiones #{project.root_object.known_regions.join(",")}"
          '

      - name: Añadir extensión WidgetKit (widgets de pantalla de inicio)
        # el proyecto ios/ se regenera en cada run (cap add): la extensión se crea aquí con
        # el gem xcodeproj a partir de las fuentes commiteadas en widget_extension_dir
        # (swift + Info.plist + <nombre>.entitlements). target :app_extension "Widgets"
        # (bundle <bundle_id>.widgets), firma manual con SU perfil, copy phase PlugIns en
        # App y dependencia. el app group va en los entitlements de AMBOS targets: es el
        # keychain access group / contenedor que comparten app y widget. va DESPUÉS del
        # cap sync (pod install no toca este target: no está en el Podfile) y de fijar la
        # versión (la extensión debe llevar la MISMA CFBundleShortVersionString/Version que
        # la app o App Store Connect rechaza el binario).
        if: ${{ inputs.widget_extension_dir != '' }}
        working-directory: packages/web/ios/App
        env:
          WIDGET_SRC: ${{ inputs.widget_extension_dir }}
          APP_GROUP: ${{ inputs.app_group }}
          BUNDLE_ID: ${{ inputs.bundle_id }}
          MIN_IOS: ${{ inputs.widget_min_ios_version || inputs.min_ios_version }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          SRC="$GITHUB_WORKSPACE/packages/web/$WIDGET_SRC"
          [ -d "$SRC" ] || { echo "::error::widget_extension_dir no existe: $SRC"; exit 1; }
          rm -rf Widgets && mkdir Widgets && cp -R "$SRC"/. Widgets/
          [ -f Widgets/Info.plist ] || { echo "::error::falta Info.plist en $WIDGET_SRC"; exit 1; }
          ENT=$(ls Widgets/*.entitlements | head -1)
          [ -n "$ENT" ] || { echo "::error::falta <nombre>.entitlements en $WIDGET_SRC"; exit 1; }
          # versión = la de la app; app group en los entitlements de la extensión y de la app.
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $MARKETING_VERSION" Widgets/Info.plist \
            || /usr/libexec/PlistBuddy -c "Add :CFBundleShortVersionString string $MARKETING_VERSION" Widgets/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_NUMBER" Widgets/Info.plist \
            || /usr/libexec/PlistBuddy -c "Add :CFBundleVersion string $BUILD_NUMBER" Widgets/Info.plist
          add_group() {
            local f="$1"
            [ -f "$f" ] || printf '<?xml version="1.0" encoding="UTF-8"?>\n<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">\n<plist version="1.0"><dict/></plist>\n' > "$f"
            /usr/libexec/PlistBuddy -c "Delete :com.apple.security.application-groups" "$f" 2>/dev/null || true
            /usr/libexec/PlistBuddy -c "Add :com.apple.security.application-groups array" "$f"
            /usr/libexec/PlistBuddy -c "Add :com.apple.security.application-groups:0 string $APP_GROUP" "$f"
          }
          add_group "$ENT"
          add_group App/App.entitlements
          echo "== entitlements de la extensión =="; cat "$ENT"
          gem list -i xcodeproj >/dev/null 2>&1 || sudo gem install xcodeproj --no-document
          ENT_NAME=$(basename "$ENT") ruby -e '
            require "xcodeproj"
            project = Xcodeproj::Project.open("App.xcodeproj")
            app = project.targets.find { |t| t.name == "App" } or abort("target App no encontrado")
            ext = project.new_target(:app_extension, "Widgets", :ios, ENV["MIN_IOS"])
            group = project.main_group.new_group("Widgets", "Widgets")
            Dir.glob("Widgets/*.swift").sort.each { |f| ext.add_file_references([group.new_file(File.basename(f))]) }
            group.new_file("Info.plist")
            group.new_file(ENV["ENT_NAME"])
            ext.build_configurations.each do |c|
              # explícito: sin PRODUCT_NAME el producto sale como ".appex" (nombre vacío) y el
              # archive muere con "Multiple commands produce .../.appex".
              c.build_settings["PRODUCT_NAME"] = "Widgets"
              c.build_settings["PRODUCT_BUNDLE_IDENTIFIER"] = "#{ENV["BUNDLE_ID"]}.widgets"
              c.build_settings["INFOPLIST_FILE"] = "Widgets/Info.plist"
              c.build_settings["GENERATE_INFOPLIST_FILE"] = "NO"
              c.build_settings["CODE_SIGN_ENTITLEMENTS"] = "Widgets/#{ENV["ENT_NAME"]}"
              c.build_settings["SWIFT_VERSION"] = "5.0"
              c.build_settings["IPHONEOS_DEPLOYMENT_TARGET"] = ENV["MIN_IOS"]
              c.build_settings["TARGETED_DEVICE_FAMILY"] = "1,2"
              c.build_settings["SKIP_INSTALL"] = "YES"
              c.build_settings["CODE_SIGN_STYLE"] = "Manual"
              c.build_settings["DEVELOPMENT_TEAM"] = ENV["APPLE_TEAM_ID"]
              c.build_settings["CODE_SIGN_IDENTITY"] = "Apple Distribution"
              c.build_settings["PROVISIONING_PROFILE_SPECIFIER"] = ENV["WIDGET_PROFILE_NAME"]
              c.build_settings["LD_RUNPATH_SEARCH_PATHS"] = ["$(inherited)", "@executable_path/Frameworks", "@executable_path/../../Frameworks"]
            end
            # la app también necesita el app group (sin SIWA no había fichero de entitlements).
            app.build_configurations.each { |c| c.build_settings["CODE_SIGN_ENTITLEMENTS"] = "App/App.entitlements" }
            app.add_dependency(ext)
            phase = app.new_copy_files_build_phase("Embed Foundation Extensions")
            phase.symbol_dst_subfolder_spec = :plug_ins
            phase.dst_path = ""
            phase.add_file_reference(ext.product_reference).settings = { "ATTRIBUTES" => ["RemoveHeadersOnCopy"] }
            project.save
          '
          echo "extensión Widgets añadida (bundle $BUNDLE_ID.widgets, perfil '$WIDGET_PROFILE_NAME')"

      - name: Importar certificado de distribución a un keychain temporal
        env:
          CERT_B64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          CERT_PASS: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
        run: |
          CERT_PATH="$RUNNER_TEMP/dist.p12"
          KEYCHAIN="$RUNNER_TEMP/app-signing.keychain-db"
          KC_PW="$(openssl rand -base64 24)"
          echo -n "$CERT_B64" | base64 --decode -o "$CERT_PATH"
          security create-keychain -p "$KC_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KC_PW" "$KEYCHAIN"
          security import "$CERT_PATH" -P "$CERT_PASS" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KC_PW" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          echo "KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

      - name: Preparar API key, provisioning profile y ExportOptions
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          IOS_WIDGET_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_WIDGET_PROVISIONING_PROFILE_BASE64 }}
          WIDGET_DIR: ${{ inputs.widget_extension_dir }}
          BUNDLE_ID: ${{ inputs.bundle_id }}
        run: |
          # asc api key (la usa altool en el upload) en la ruta por defecto
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          ASC_KEY_PATH="$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s' "$ASC_API_KEY_P8" > "$ASC_KEY_PATH"
          echo "ASC_KEY_PATH=$ASC_KEY_PATH" >> "$GITHUB_ENV"
          # provisioning profile de App Store → firma MANUAL (sin cloud signing, que
          # quiere gestionar cert/perfil en la nube).
          PP="$RUNNER_TEMP/pp.mobileprovision"
          echo -n "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode -o "$PP"
          PROF_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROF_DIR"
          UUID=$(security cms -D -i "$PP" | plutil -extract UUID raw -)
          cp "$PP" "$PROF_DIR/$UUID.mobileprovision"
          echo "provisioning profile instalado UUID=$UUID"
          # perfil de la extensión de widgets (bundle <bundle_id>.widgets), si hay widgets.
          WIDGET_MAPPING=""
          if [ -n "$WIDGET_DIR" ]; then
            WPP="$RUNNER_TEMP/widget.mobileprovision"
            echo -n "$IOS_WIDGET_PROVISIONING_PROFILE_BASE64" | base64 --decode -o "$WPP"
            WUUID=$(security cms -D -i "$WPP" | plutil -extract UUID raw -)
            cp "$WPP" "$PROF_DIR/$WUUID.mobileprovision"
            echo "provisioning profile de widgets instalado UUID=$WUUID"
            WIDGET_MAPPING="<key>${BUNDLE_ID}.widgets</key><string>${WIDGET_PROFILE_NAME}</string>"
          fi
          # ExportOptions.plist — firma manual con el cert de distribución + el perfil.
          cat > packages/web/ios/App/exportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key><dict>
              <key>${BUNDLE_ID}</key><string>${PROFILE_NAME}</string>
              ${WIDGET_MAPPING}
            </dict>
            <key>uploadSymbols</key><true/>
            <key>destination</key><string>export</string>
          </dict></plist>
          PLIST

      - name: Archive
        working-directory: packages/web/ios/App
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # firma MANUAL en el archive con el perfil de App Store (distribución: sin lista
          # de devices, así que NO da "team has no devices" como el de development). hay que
          # firmar AQUÍ para que los entitlements (p.ej. applesignin) queden embebidos en el
          # binario — archivar sin firmar (CODE_SIGNING_ALLOWED=NO) salta el procesado de
          # entitlements y el sheet nativo de Sign in with Apple falla con error 1000.
          # el PROVISIONING_PROFILE_SPECIFIER NO va aquí (global) porque rompe los Pods de
          # capacitor; se fija solo en el target App en el step "Fijar firma manual".
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            archive

      - name: Export IPA
        working-directory: packages/web/ios/App
        run: |
          # firma manual: usa el cert del keychain + el perfil instalado (sin -allowProvisioningUpdates)
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportPath "$RUNNER_TEMP/ipa" \
            -exportOptionsPlist exportOptions.plist
          IPA=$(ls "$RUNNER_TEMP"/ipa/*.ipa | head -1)
          echo "IPA_PATH=$IPA" >> "$GITHUB_ENV"
          echo "ipa generado: $IPA"

      - name: Verificar entitlement Sign in with Apple en el IPA
        # falla RUIDOSAMENTE si el entitlement no quedó embebido (causa del error 1000 del
        # sheet nativo), en vez de descubrirlo en el dispositivo tras subir a TestFlight.
        if: ${{ inputs.sign_in_with_apple }}
        run: |
          mkdir -p "$RUNNER_TEMP/ipa-unz"
          unzip -o "$IPA_PATH" -d "$RUNNER_TEMP/ipa-unz" >/dev/null
          APP=$(find "$RUNNER_TEMP/ipa-unz/Payload" -maxdepth 1 -name '*.app' | head -1)
          echo "== entitlements embebidos en $(basename "$APP") =="
          codesign -d --entitlements :- "$APP" 2>/dev/null || true
          if codesign -d --entitlements :- "$APP" 2>/dev/null | grep -q "com.apple.developer.applesignin"; then
            echo "OK: com.apple.developer.applesignin embebido — el sheet nativo funcionará"
          else
            echo "::error::el IPA NO lleva com.apple.developer.applesignin → Sign in with Apple fallará (error 1000)"
            exit 1
          fi

      - name: Verificar la extensión de widgets en el IPA
        # falla aquí, y no en App Store Connect o en el dispositivo, si el .appex no quedó
        # embebido o app/extensión no llevan el app group en sus entitlements.
        if: ${{ inputs.widget_extension_dir != '' }}
        env:
          APP_GROUP: ${{ inputs.app_group }}
        run: |
          mkdir -p "$RUNNER_TEMP/ipa-unz-w"
          unzip -o "$IPA_PATH" -d "$RUNNER_TEMP/ipa-unz-w" >/dev/null
          APP=$(find "$RUNNER_TEMP/ipa-unz-w/Payload" -maxdepth 1 -name '*.app' | head -1)
          APPEX="$APP/PlugIns/Widgets.appex"
          [ -d "$APPEX" ] || { echo "::error::el IPA no lleva PlugIns/Widgets.appex"; exit 1; }
          for bin in "$APP" "$APPEX"; do
            echo "== entitlements de $(basename "$bin") =="
            codesign -d --entitlements :- "$bin" 2>/dev/null || true
            codesign -d --entitlements :- "$bin" 2>/dev/null | grep -q "$APP_GROUP" \
              || { echo "::error::$(basename "$bin") no lleva el app group $APP_GROUP"; exit 1; }
          done
          echo "OK: extensión de widgets embebida con app group $APP_GROUP en app y extensión"

      - name: Subir a App Store Connect (TestFlight)
        if: ${{ inputs.upload }}
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          xcrun altool --upload-app -t ios -f "$IPA_PATH" \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"

      - name: Guardar IPA como artifact
        if: always() && env.IPA_PATH != ''
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.app }}-ios-ipa
          path: ${{ env.IPA_PATH }}
          if-no-files-found: warn

      - name: Limpiar keychain
        if: always()
        run: security delete-keychain "$KEYCHAIN" || true
