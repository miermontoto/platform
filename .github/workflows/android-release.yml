# workflow REUTILIZABLE (workflow_call): build + firma del Android App Bundle (.aab)
# en un runner linux, con subida opcional a Google Play. vive en el repo platform y lo
# invocan las apps que usan platform como submódulo, desde un caller fino:
#
#   jobs:
#     release:
#       uses: miermontoto/platform/.github/workflows/android-release.yml@main
#       with:
#         app: duckhunt                    # slug: nombre del artifact y de <app>.properties
#         package_name: info.duckhunt.app  # applicationId en Google Play
#         upload: true                     # subir a Play (requiere service account)
#         track: internal
#       secrets: inherit
#
# el caller conserva sus triggers (push a main / workflow_dispatch / push de tag
# android-v*) y su concurrency; la lógica de build vive aquí y se corrige UNA vez
# para todas las apps.
#
# BUILD AUTOMÁTICO (push a main): el job `guard` filtra los push a RAMA por el input
# `path_filter` (pathspecs de git, uno por línea) para no lanzar un release por un
# commit que solo toca la api — recuerda que el pre-commit hook bumpa VERSION en CADA
# commit, así que sin filtro dispararía siempre. dispatch y push de tag NO se filtran
# nunca: son acciones deliberadas. no se usa el `paths:` nativo de github a propósito,
# porque en push de tag el evento no trae commits y saltaría el workflow entero.
#
# SECRETS esperados en el repo de la app (Settings → Secrets and variables → Actions),
# heredados con `secrets: inherit`:
#   ANDROID_KEYSTORE_BASE64           ← base64 del upload keystore (~/Android/keystores/upload.jks)
#   ANDROID_KEYSTORE_PASSWORD         ← storePassword
#   ANDROID_KEY_ALIAS                 ← keyAlias
#   ANDROID_KEY_PASSWORD              ← keyPassword
#   ANDROID_GOOGLE_SERVICES_JSON      ← contenido de android/app/google-services.json (FCM; opcional)
#   ANDROID_PLAY_SERVICE_ACCOUNT_JSON ← json íntegro de la key del service account de la Play
#                                       Developer API (solo si upload=true; ver "SUBIDA A PLAY")
#   SUBMODULES_PAT (opcional)         ← PAT con lectura del submódulo platform (solo si fuese privado)
#
# IMPORTANTE: la upload key es la MISMA que firma las publicaciones de Play. no la
# cambies si la app ya está publicada (Play rechaza otra firma).
#
# VERSIONADO: el versionName se sincroniza en build time desde la versión de la app
# (input `version_file`, por defecto packages/api/src/constants.ts con `export const
# VERSION = '...'`, la fuente de verdad que bumpa el pre-commit hook de tooling/version);
# el versionName committeado en build.gradle es solo fallback si el fichero/constante no
# existen. el versionCode (entero con el que Play deduplica las subidas: único y
# estrictamente creciente por aab) = base committeada + run_number del caller, fijado en
# el paso "Fijar versionCode único"; así cada run produce un aab distinto sin
# recommittear. mismo patrón que CFBundleVersion en ios-release.yml.
#
# SUBIDA A PLAY (r0adkll/upload-google-play, gated por el input `upload`): por defecto al
# track `internal` — el paralelo a TestFlight: solo testers, nunca público.
# SETUP DE UNA SOLA VEZ por app (linux/navegador):
#  0. Google Play Console ($25 una vez). app creada con el applicationId. la PRIMERA subida
#     debe ser MANUAL por la consola: Play bloquea la API hasta que una app nueva tiene su
#     primer release a mano (usa el artifact de este workflow para esa vez).
#  1. Google Cloud → un proyecto → APIs & Services → habilita "Google Play Android Developer API".
#  2. IAM & Admin → Service Accounts → crea uno (sin roles GCP) → Keys → Add key → JSON → descarga.
#  3. Play Console → Users and permissions → Invite new users → email del service account →
#     permisos de la app "Release to testing tracks" (+ "Release to production" si usas ese track).
#     (Play Console ↔ proyecto GCP se enlazan en Play Console → Setup → API access.)
#  4. secret ANDROID_PLAY_SERVICE_ACCOUNT_JSON ← contenido ÍNTEGRO del .json de la key.

name: Android release (reusable)

on:
  workflow_call:
    inputs:
      app:
        description: 'slug de la app: nombra el artifact y el fichero <app>.properties que lee build.gradle'
        required: true
        type: string
      package_name:
        description: 'applicationId en Google Play (solo se usa si upload=true)'
        required: true
        type: string
      upload:
        description: 'subir el aab a Google Play (requiere ANDROID_PLAY_SERVICE_ACCOUNT_JSON)'
        required: false
        type: boolean
        default: false
      track:
        description: 'track de Play donde publicar (internal | alpha | beta | production)'
        required: false
        type: string
        default: internal
      version_file:
        description: 'fichero con la versión de la app (export const VERSION = ...); sincroniza el versionName del aab en build time'
        required: false
        type: string
        default: packages/api/src/constants.ts
      path_filter:
        description: 'pathspecs de git (uno por línea) que disparan el build en push a rama; vacío → siempre'
        # el default deja fuera pnpm-lock.yaml y packages/api a propósito: el lockfile
        # se mueve con cualquier bump de dependabot de la api (irrelevante para el
        # binario móvil) y constants.ts lo bumpa el pre-commit hook en CADA commit. si
        # una app quiere reconstruir también con el lockfile, se lo pasa desde su caller.
        required: false
        type: string
        default: |
          packages/web
          platform
          .github/workflows

jobs:
  guard:
    # filtra los push a rama del build AUTOMÁTICO: un commit que solo toca la api no
    # merece un release. NO se usa el filtro `paths` nativo de github porque en push
    # de TAG el evento no trae commits y el workflow entero se saltaría, matando el
    # release manual por tag. aquí en cambio dispatch y tag pasan siempre.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      build: ${{ steps.decide.outputs.build }}
    steps:
      - name: Checkout (historia completa para diffear el push)
        # solo hace falta clonar cuando de verdad se va a diffear: en dispatch y tag
        # el paso siguiente sale por la rama de "sin filtro" sin tocar git.
        if: github.event_name == 'push' && github.ref_type == 'branch'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decidir si el push toca el build móvil
        id: decide
        env:
          FILTER: ${{ inputs.path_filter }}
          BEFORE: ${{ github.event.before }}
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          # solo se filtra el push a rama; dispatch y tag son acciones deliberadas.
          if [ "$EVENT" != "push" ] || [ "$REF_TYPE" != "branch" ] || [ -z "$FILTER" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"; echo "sin filtro (evento $EVENT, ref_type $REF_TYPE)"; exit 0
          fi
          # primer push de la rama o force-push: el commit previo no existe → no se
          # puede diffear, así que se construye (fail-open, nunca perder un release).
          if [ -z "$BEFORE" ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            echo "build=true" >> "$GITHUB_OUTPUT"; echo "sin commit previo diffeable ($BEFORE) → build"; exit 0
          fi
          # $FILTER SIN comillas a propósito: se apoya en el word splitting para
          # pasar cada línea como un pathspec suelto a git.
          CHANGED=$(git diff --name-only "$BEFORE" "$GITHUB_SHA" -- $FILTER)
          if [ -n "$CHANGED" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "cambios que afectan al build móvil:"; echo "$CHANGED"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "el push no toca ninguno de estos pathspecs → se omite el release:"; echo "$FILTER"
          fi

  build:
    needs: guard
    if: needs.guard.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout (con submódulo platform)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.SUBMODULES_PAT || github.token }}

      - name: Comprobar secrets de firma
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KS" ]; then
            echo "::error::falta ANDROID_KEYSTORE_BASE64 — revisa la cabecera del workflow en platform"
            exit 1
          fi

      - name: Comprobar secret de Play (solo si toca subir)
        # falla rápido ANTES del build si se pidió upload sin la credencial, en vez de
        # gastar ~minutos compilando para morir en el último paso.
        if: ${{ inputs.upload }}
        env:
          SA: ${{ secrets.ANDROID_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$SA" ]; then
            echo "::error::falta ANDROID_PLAY_SERVICE_ACCOUNT_JSON — necesario para subir a Play (ver cabecera). usa upload=false para solo generar el artifact"
            exit 1
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup JDK 21
        # capacitor 7 (módulo capacitor-android) compila con source release 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: google-services.json (FCM, opcional)
        env:
          GS: ${{ secrets.ANDROID_GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GS" ]; then
            printf '%s' "$GS" > packages/web/android/app/google-services.json
            echo "google-services.json escrito (push habilitado)"
          else
            echo "sin google-services.json (build sin push)"
          fi

      - name: Keystore + signing properties
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
          APP: ${{ inputs.app }}
        run: |
          # build.gradle lee la firma de ~/Android/keystores/<app>.properties → storeFile.
          KS_DIR="$HOME/Android/keystores"
          mkdir -p "$KS_DIR"
          echo -n "$KS_B64" | base64 -d > "$KS_DIR/upload.jks"
          {
            printf 'storeFile=%s\n' "$KS_DIR/upload.jks"
            printf 'storePassword=%s\n' "$KS_PASS"
            printf 'keyAlias=%s\n' "$KEY_ALIAS"
            printf 'keyPassword=%s\n' "$KEY_PASS"
          } > "$KS_DIR/$APP.properties"
          echo "keystore + properties listos en $KS_DIR/$APP.properties"

      - name: Fijar versionCode único (evita colisión de aab en Play)
        working-directory: packages/web/android
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          # Play deduplica las subidas por versionCode (entero), que debe ser único y
          # estrictamente creciente por aab; sin esto, dos builds del mismo commit chocan
          # al subir. el versionCode committeado es el floor (bump manual junto al versionName);
          # aquí le sumamos el run_number del workflow CALLER para garantizar un código único
          # y monótono en cada run sin recommittear. cap sync no toca defaultConfig, así que
          # el override persiste hasta bundleRelease.
          GRADLE=app/build.gradle
          BASE=$(grep -oP 'versionCode \K[0-9]+' "$GRADLE")
          if [ -z "$BASE" ]; then
            echo "::error::no se encontró versionCode en $GRADLE"; exit 1
          fi
          NEW=$((BASE + RUN_NUMBER))
          sed -i "s/versionCode [0-9]\+/versionCode $NEW/" "$GRADLE"
          echo "versionCode $BASE → $NEW (floor committeado + run_number $RUN_NUMBER)"

      - name: Sincronizar versionName con la versión de la app
        working-directory: packages/web/android
        env:
          VERSION_FILE: ${{ inputs.version_file }}
        run: |
          # el versionName committeado en build.gradle se queda obsoleto en cuanto el
          # pre-commit hook bumpa la versión de la app; aquí se sincroniza en build time
          # desde la fuente de verdad (version_file) para que cada aab lleve la versión
          # real. si el fichero o la constante no existen se conserva el committeado
          # (warning, no error: versionName es cosmético para Play).
          SRC="$GITHUB_WORKSPACE/$VERSION_FILE"
          if [ ! -f "$SRC" ]; then
            echo "::warning::no existe $VERSION_FILE — se mantiene el versionName committeado"; exit 0
          fi
          VERSION=$(grep -oP "export const VERSION = '\K[^']+" "$SRC" | head -n1)
          if [ -z "$VERSION" ]; then
            echo "::warning::no hay 'export const VERSION' en $VERSION_FILE — se mantiene el versionName committeado"; exit 0
          fi
          GRADLE=app/build.gradle
          OLD=$(grep -oP 'versionName "\K[^"]+' "$GRADLE")
          sed -i "s/versionName \"[^\"]*\"/versionName \"$VERSION\"/" "$GRADLE"
          echo "versionName $OLD → $VERSION (desde $VERSION_FILE)"

      - name: Build AAB (firmado)
        working-directory: packages/web
        # mobile:aab = VITE_API_BASE=prod vite build + cap sync android + gradlew bundleRelease
        run: pnpm run mobile:aab

      - name: Subir AAB como artifact
        # va ANTES del paso de Play: si la subida a Play falla, el aab queda igualmente
        # disponible como artifact para subirlo a mano.
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.app }}-android-aab
          path: packages/web/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Subir a Google Play
        # r0adkll envuelve la Play Developer API: crea un edit, sube el aab, lo asigna al
        # track y commitea. status=completed = disponible ya para los testers del track.
        # requiere la PRIMERA subida MANUAL de la app (ver cabecera).
        if: ${{ inputs.upload }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.ANDROID_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ inputs.package_name }}
          releaseFiles: packages/web/android/app/build/outputs/bundle/release/app-release.aab
          # 'track' quedó deprecada en r0adkll; 'tracks' es su sucesora (lista
          # separada por comas, un solo track es una string normal).
          tracks: ${{ inputs.track }}
          status: completed
